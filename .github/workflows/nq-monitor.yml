name: NQ POC el. pastas

on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Patikrinti duomenis be laisku ir be pazangos issaugojimo'
        type: boolean
        default: false
      test_email:
        description: 'Siusti tik bandomaji laiska'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nq-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        if: github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -v
      - name: Check NQ or send explicit test
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python monitor.py --dry-run
          elif [ "$TEST_EMAIL" = "true" ]; then
            python monitor.py --test-email
          else
            python monitor.py --once
          fi
      - name: Persist progress and pending signals
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -d state ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- state/*.json
            if ! git diff --cached --quiet; then
              git commit -m "Save NQ monitoring progress"
              git pull --rebase origin "$TARGET_BRANCH"
              git push origin "HEAD:$TARGET_BRANCH"
            fi
          fi
